[phases.setup]
nixPkgs = ["python311", "nodejs_20"]

[phases.install]
cmds = ["python3.11 -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install -r requirements.txt"]

[phases.build]
cmds = ["cd vault-frontend && npm install && npm run build"]

[start]
cmd = ". /opt/venv/bin/activate && uvicorn main:app --host 0.0.0.0 --port $PORT"
